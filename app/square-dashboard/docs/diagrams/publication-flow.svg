<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
<title id="title">Publication pipeline</title><desc id="desc">Account-specific schedules, immutable AI evidence and explicit outcome handling</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#848e9c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#fafafa"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="46" fill="#181a20" font-size="25" font-weight="650">Publication pipeline</text><text x="35" y="75" fill="#626c7a" font-size="14" font-weight="400">Account-specific schedules, immutable AI evidence and explicit outcome handling</text><rect x="35" y="110" width="320" height="108" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="53" y="140" fill="#181a20" font-size="17" font-weight="650">1  Account-owned schedule</text><text x="53" y="166" fill="#626c7a" font-size="13" font-weight="400">Persist anchor, sampled seconds and due time</text><text x="53" y="188" fill="#626c7a" font-size="13" font-weight="400">Manual requests enter the same pipeline</text><rect x="415" y="110" width="320" height="108" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="433" y="140" fill="#181a20" font-size="17" font-weight="650">2  Weighted preset selection</text><text x="433" y="166" fill="#626c7a" font-size="13" font-weight="400">Only eligible published versions</text><text x="433" y="188" fill="#626c7a" font-size="13" font-weight="400">Freeze rules, AI models and selection</text><rect x="795" y="110" width="330" height="108" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="813" y="140" fill="#181a20" font-size="17" font-weight="650">3  Read verified sources</text><text x="813" y="166" fill="#626c7a" font-size="13" font-weight="400">Rolling 24h market; readable article bodies</text><text x="813" y="188" fill="#626c7a" font-size="13" font-weight="400">Store dates, facts, hashes and expiry</text><path d="M355 164 H415" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 164 H795" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 218 V263 H195 V300" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="300" width="320" height="128" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="53" y="330" fill="#181a20" font-size="17" font-weight="650">4  Approved AI final text</text><text x="53" y="356" fill="#626c7a" font-size="13" font-weight="400">Full rendered prompt + model response</text><text x="53" y="378" fill="#626c7a" font-size="13" font-weight="400">Rules and optional AI review</text><text x="53" y="400" fill="#626c7a" font-size="13" font-weight="400">Bounded model-only repair</text><rect x="415" y="300" width="320" height="128" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="433" y="330" fill="#181a20" font-size="17" font-weight="650">5  Managed image</text><text x="433" y="356" fill="#626c7a" font-size="13" font-weight="400">Existing library or GPT Image 2</text><text x="433" y="378" fill="#626c7a" font-size="13" font-weight="400">Persist bytes, hash and provenance</text><text x="433" y="400" fill="#626c7a" font-size="13" font-weight="400">Enforce requested aspect ratio</text><rect x="795" y="300" width="330" height="128" rx="12" fill="#fff9df" stroke="#f0b90b"/><text x="813" y="330" fill="#181a20" font-size="17" font-weight="650">6  Final gate + intent</text><text x="813" y="356" fill="#626c7a" font-size="13" font-weight="400">Pause / account / lease / approved model</text><text x="813" y="378" fill="#626c7a" font-size="13" font-weight="400">Content, asset and source evidence</text><text x="813" y="400" fill="#626c7a" font-size="13" font-weight="400">Commit intent before the HTTP submission</text><path d="M355 364 H415" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 364 H795" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 428 V480 H310 V520" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M960 480 H960 V520" fill="none" stroke="#b88700" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="520" width="510" height="117" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="53" y="550" fill="#181a20" font-size="17" font-weight="650">Confirmed publication</text><text x="53" y="576" fill="#626c7a" font-size="13" font-weight="400">Store receipt; sample next account time independently</text><text x="53" y="598" fill="#626c7a" font-size="13" font-weight="400">Public verification runs separately; never causes resend</text><rect x="615" y="520" width="510" height="117" rx="12" fill="#fff9df" stroke="#f0b90b"/><text x="633" y="550" fill="#181a20" font-size="17" font-weight="650">Unknown submission result</text><text x="633" y="576" fill="#626c7a" font-size="13" font-weight="400">Keep original intent and isolate this account</text><text x="633" y="598" fill="#626c7a" font-size="13" font-weight="400">Read-only reconciliation; never blind resubmission</text><text x="35" y="680" fill="#181a20" font-size="14" font-weight="400">Global pause blocks new submission; one active publication pipeline per account.</text><text x="35" y="706" fill="#181a20" font-size="14" font-weight="400">External exactly-once delivery is not assumed. Unknown outcomes remain explicit.</text><text x="35" y="738" fill="#626c7a" font-size="12" font-weight="400">Square Platform | Implementation logic | 2026-10-20</text></g></svg>