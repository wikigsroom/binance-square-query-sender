<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">Dashboard and backend</title><desc id="desc">Remote-server product boundary; native services without Docker or WSL</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#848e9c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#fafafa"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="46" fill="#181a20" font-size="25" font-weight="650">Dashboard and backend</text><text x="35" y="75" fill="#626c7a" font-size="14" font-weight="400">Remote-server product boundary; native services without Docker or WSL</text><rect x="35" y="115" width="300" height="126" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="53" y="145" fill="#181a20" font-size="17" font-weight="650">Browser dashboard</text><text x="53" y="171" fill="#626c7a" font-size="13" font-weight="400">Accounts / weights / schedules</text><text x="53" y="193" fill="#626c7a" font-size="13" font-weight="400">Presets / images / searchable posts</text><text x="53" y="215" fill="#626c7a" font-size="13" font-weight="400">Tasks / actual prompts / AI integration</text><rect x="400" y="115" width="300" height="126" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="418" y="145" fill="#181a20" font-size="17" font-weight="650">Authenticated management API</text><text x="418" y="171" fill="#626c7a" font-size="13" font-weight="400">Same-origin session and CSRF</text><text x="418" y="193" fill="#626c7a" font-size="13" font-weight="400">Versioned config; idempotent actions</text><text x="418" y="215" fill="#626c7a" font-size="13" font-weight="400">Masked credential responses</text><rect x="765" y="115" width="300" height="126" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="783" y="145" fill="#181a20" font-size="17" font-weight="650">Persistent service state</text><text x="783" y="171" fill="#626c7a" font-size="13" font-weight="400">Native PostgreSQL for remote operation</text><text x="783" y="193" fill="#626c7a" font-size="13" font-weight="400">Encrypted credentials and immutable evidence</text><text x="783" y="215" fill="#626c7a" font-size="13" font-weight="400">Managed image storage</text><path d="M335 179 H400" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 179 H765" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="325" width="300" height="126" rx="12" fill="#fff9df" stroke="#f0b90b"/><text x="418" y="355" fill="#181a20" font-size="17" font-weight="650">Worker</text><text x="418" y="381" fill="#626c7a" font-size="13" font-weight="400">Independent account due times</text><text x="418" y="403" fill="#626c7a" font-size="13" font-weight="400">AI / source / media / final gate</text><text x="418" y="425" fill="#626c7a" font-size="13" font-weight="400">Receipts and asynchronous verification</text><rect x="765" y="325" width="300" height="126" rx="12" fill="#ffffff" stroke="#eaecef"/><text x="783" y="355" fill="#181a20" font-size="17" font-weight="650">External adapters</text><text x="783" y="381" fill="#626c7a" font-size="13" font-weight="400">Chat / Responses / Messages</text><text x="783" y="403" fill="#626c7a" font-size="13" font-weight="400">GPT Image 2 / market / readable news</text><text x="783" y="425" fill="#626c7a" font-size="13" font-weight="400">Square upload / publish / public detail</text><path d="M915 241 V277 H550 V325" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 388 H765" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 325 V294 H855 V241" fill="none" stroke="#848e9c" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="491" fill="#181a20" font-size="14" font-weight="400">UI polls the API; workers persist results. Closing the browser does not stop schedules.</text><text x="35" y="528" fill="#626c7a" font-size="12" font-weight="400">Square Platform | Implementation logic | 2026-10-20</text></g></svg>