<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="630" viewBox="0 0 1180 630" role="img" aria-labelledby="title desc">
<title id="title">Platform architecture</title><desc id="desc">Static dashboard, durable scheduling and auditable external adapters</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8191a1"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#182638}.title{font-size:17px;font-weight:600}.line{font-size:13px;fill:#506175}</style>
<rect width="1180" height="630" rx="18" fill="#f5f7fa"/>
<text x="40" y="45" font-size="25" font-weight="700">Platform architecture</text><text x="40" y="74" class="line">Static dashboard, durable scheduling and auditable external adapters</text>
<rect x="40" y="125" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="56" y="154" class="title">Browser dashboard</text><text x="56" y="179" class="line">Accounts, schedules, presets and posts</text><text x="56" y="200" class="line">Static React UI / HTTPS / light and dark</text><rect x="435" y="125" width="310" height="112" rx="12" fill="#fff7d7" stroke="#d2a400"/><text x="451" y="154" class="title">Management API</text><text x="451" y="179" class="line">Fastify /api/v1, session and CSRF</text><text x="451" y="200" class="line">Exact-origin CORS, versioned updates</text><rect x="830" y="125" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="846" y="154" class="title">Persistent state</text><text x="846" y="179" class="line">Native PostgreSQL, SQL / JSONB</text><text x="846" y="200" class="line">Encrypted credentials, evidence, intents</text><path d="M350 181 H435" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 181 H830" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="435" y="320" width="310" height="112" rx="12" fill="#fff7d7" stroke="#d2a400"/><text x="451" y="349" class="title">Scheduler and worker</text><text x="451" y="374" class="line">Independent account timers and weights</text><text x="451" y="395" class="line">Leases, fences, capacity and pipeline</text><rect x="40" y="320" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="56" y="349" class="title">Sources and approved AI</text><text x="56" y="374" class="line">Binance / Jinse / BlockBeats</text><text x="56" y="395" class="line">Text models and GPT Image 2 generation</text><rect x="830" y="320" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="846" y="349" class="title">Square and managed media</text><text x="846" y="374" class="line">Image bytes, hashes and provenance</text><text x="846" y="395" class="line">Upload, publish receipt, public verification</text><path d="M590 237 V320" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 376 H830" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 376 H350" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M985 237 V276 H685 V320" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="490" class="title">The browser observes. The server schedules and publishes.</text><text x="40" y="520" class="line">The API and worker may share one process. Separate workers require PostgreSQL; PGlite is development only.</text><text x="40" y="545" class="line">Receipts confirm submission; public verification independently checks body, token tags and image.</text><text x="40" y="610" class="line">Square Desk | Implemented behavior | 2026-10-22 | Native services, no Docker / WSL</text></svg>