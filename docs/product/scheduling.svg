<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="630" viewBox="0 0 1180 630" role="img" aria-labelledby="title desc">
<title id="title">Independent randomized scheduling</title><desc id="desc">Each account owns its time interval, preset probabilities and durable execution state</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8191a1"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#182638}.title{font-size:17px;font-weight:600}.line{font-size:13px;fill:#506175}</style>
<rect width="1180" height="630" rx="18" fill="#f5f7fa"/>
<text x="40" y="45" font-size="25" font-weight="700">Independent randomized scheduling</text><text x="40" y="74" class="line">Each account owns its time interval, preset probabilities and durable execution state</text>
<rect x="40" y="125" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="56" y="154" class="title">Per-account time</text><text x="56" y="179" class="line">min / max inclusive integer seconds</text><text x="56" y="200" class="line">anchor + sampled delay = nextDueAt</text><rect x="435" y="125" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="451" y="154" class="title">Weighted eligibility</text><text x="451" y="179" class="line">Published and available presets only</text><text x="451" y="200" class="line">Probability = weight / eligible weight sum</text><rect x="830" y="125" width="310" height="112" rx="12" fill="#fff7d7" stroke="#d2a400"/><text x="846" y="154" class="title">One active pipeline</text><text x="846" y="179" class="line">Persist selected version and lease fence</text><text x="846" y="200" class="line">Independent job / text / image capacity</text><path d="M350 181 H435" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 181 H830" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="435" y="320" width="310" height="112" rx="12" fill="white" stroke="#d8e0e8"/><text x="451" y="349" class="title">Confirmed publication</text><text x="451" y="374" class="line">Update lastPublishedAt</text><text x="451" y="395" class="line">Sample and persist the next account time</text><path d="M985 237 V376 H745" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 376 H195 V237" fill="none" stroke="#8191a1" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="492" class="title">Refreshes do not resample. Restart reads durable state. Closing the UI does not stop the worker.</text><text x="40" y="523" class="line">An uncertain submission isolates that account. Resume and resample are explicit audited operations.</text><text x="40" y="610" class="line">Square Desk | Implemented behavior | 2026-10-22 | Native services, no Docker / WSL</text></svg>