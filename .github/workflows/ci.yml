name: Native platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/square-service/package-lock.json
            app/square-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix app/square-service --no-audit --no-fund
      - run: npm ci --prefix app/square-dashboard --no-audit --no-fund
      - run: npm run check:platform
      - run: npm run build:platform
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: app/square-dashboard
      - run: npm run test:dashboard
      - run: npm run verify:repository
